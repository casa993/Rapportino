<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rapportino">
<title>Il mio rapportino</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#14201e;--mut:#62706d;--ac:#0d9488;--ac2:#0f766e;--acx:#fff;--bd:#d9e2e0;--tint:rgba(13,148,136,.13);--warn:#b45309;--sh:0 2px 14px rgba(20,32,30,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#1a2321;--tx:#eef5f3;--mut:#9db0ac;--ac:#2dd4bf;--ac2:#14b8a6;--acx:#042f2a;--bd:#2c3a37;--tint:rgba(45,212,191,.16);--warn:#fbbf24;--sh:0 2px 14px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#1a2321;--tx:#eef5f3;--mut:#9db0ac;--ac:#2dd4bf;--ac2:#14b8a6;--acx:#042f2a;--bd:#2c3a37;--tint:rgba(45,212,191,.16);--warn:#fbbf24;--sh:0 2px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 16px 130px}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px;color:var(--ac)}
h2{font-size:1.15rem;font-weight:700;margin:0 0 12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -6px 24px rgba(0,0,0,.08);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;padding:8px 2px;min-height:60px;font-size:.8rem;font-weight:600;color:var(--mut);border-radius:16px}
nav button .ic{font-size:1.55rem;line-height:1}
nav button.on{background:var(--tint);color:var(--ac)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:14px 16px;min-height:52px;font-weight:600;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acx);border:0;font-weight:700;box-shadow:0 4px 14px rgba(13,148,136,.28)}
input,textarea,select{width:100%;font-size:17px;background:var(--bg);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin:6px 0 14px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac);background:var(--card)}
input[type=checkbox]{width:24px!important;height:24px;accent-color:var(--ac);padding:0}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mut);letter-spacing:.01em}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px}.row>*{flex:1}
.mut{color:var(--mut);font-size:.92rem}
.stat{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0 12px}.stat b{display:block;font-size:1.65rem;line-height:1.1}
.item{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--bd);align-items:center}
.item:first-child{border-top:0}
.cl{cursor:pointer;min-height:60px}
.warn{color:var(--warn)}
.done{text-decoration:line-through;color:var(--mut)}
.mic.rec{background:#dc2626;color:#fff;border-color:#dc2626}
.ans{white-space:pre-wrap}
.job{border-top:1px solid var(--bd)}
.jobh{display:flex;align-items:center;gap:10px;padding:14px 0;cursor:pointer;min-height:64px}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ac);font-size:1.8rem;line-height:1;transition:transform .15s}
.job.open .chev{transform:rotate(90deg)}
.jobd{padding:0 0 16px}
.kv{display:flex;gap:10px;padding:5px 0}.kv span:first-child{color:var(--mut);flex:0 0 104px;font-size:.92rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.acts button:last-child{grid-column:1/-1}
.acts button{min-height:52px}
.acts .del{color:#dc2626}
.badge{font-size:.76rem;margin-left:8px;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--warn);font-weight:700;white-space:nowrap;vertical-align:middle}
.badge.ok{color:var(--ac)}
#sug button{width:100%;text-align:left;border:0;background:transparent;min-height:50px}
input[type=date],input[type=month]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;min-height:56px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;flex:0 0 16px}
.dot.g{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.18)}
.dot.r{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.18)}
.dot.n{background:var(--bd)}
.dot.in{width:12px;height:12px;flex:0 0 12px;margin-right:8px;vertical-align:middle;box-shadow:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Il mio rapportino</h1>
<p class="mut" id="sync" style="margin:-6px 0 6px"></p>
<nav id="nav">
<button data-t="nuovo" class="on"><span class="ic">✍️</span>Nuovo</button>
<button data-t="registro"><span class="ic">📋</span>Registro</button>
<button data-t="prev"><span class="ic">🧾</span>Preventivi</button>
<button data-t="fare"><span class="ic">✅</span>Da fare</button>
</nav>

<section id="t-nuovo">
<input id="voce" type="hidden">
<p class="mut" id="nota"></p>
<div class="card">
<h2>Rapportino</h2>
<label>Data</label><input id="f-data" type="date">
<label>Cliente</label><input id="f-cliente" autocomplete="off" placeholder="Es. Signora Maria"><div id="sug" class="card" hidden style="padding:4px;margin:-6px 0 10px"></div>
<div id="persbox" hidden><label>Persona (facoltativa)</label>
<select id="f-pers" style="margin:6px 0 10px"></select>
<div class="row" style="margin-bottom:10px"><input id="f-newp" placeholder="Nuova persona" style="margin:0"><button id="addp" style="flex:0 0 auto">Aggiungi</button></div></div>
<label>Indirizzo</label><input id="f-ind">
<label>Lavoro svolto</label><textarea id="f-lavoro" rows="2"></textarea>
<button id="mic" class="mic" hidden style="width:100%;margin:-4px 0 14px">🎤 Detta il lavoro</button>
<div class="row"><div><label>Ore</label><input id="f-ore" inputmode="decimal"></div><div><label>Km</label><input id="f-km" inputmode="decimal"></div></div>
<label>Materiali (uno per riga, es. «3 raccordi»)</label><textarea id="f-mat" rows="3"></textarea>
<label>Costo materiali (€)</label><input id="f-costo" inputmode="decimal" placeholder="Es. 35,50">
<label>Problemi</label><input id="f-prob">
<label>Da fare (uno per riga)</label><textarea id="f-todo" rows="2"></textarea>
<label>Foto (facoltative, max 4)</label><input id="f-foto" type="file" accept="image/*" multiple>
<div id="anteprime" class="mut" style="margin:-6px 0 10px"></div>
<button id="rmfoto" hidden style="margin-bottom:10px">Togli le foto salvate</button>
<button id="salva" class="p" style="width:100%">Salva rapportino</button>
<button id="annulla" hidden style="width:100%;margin-top:8px">Annulla modifica</button>
</div>
</section>

<section id="t-registro" hidden>
<button id="newcl" class="p" style="width:100%;margin-bottom:10px">+ Aggiungi cliente</button>
<div class="card" id="clform" hidden><label>Nome</label><input id="c-n"><label>Indirizzo</label><input id="c-i"><label>Telefono</label><input id="c-t" inputmode="tel">
<label>Persone di riferimento (una per riga)</label><textarea id="c-p" rows="2"></textarea><div class="row"><button id="c-s" class="p">Salva cliente</button><button id="c-x">Annulla</button></div></div>
<div class="row"><input id="mese" type="month" aria-label="Mese"><button id="tutti" style="flex:0 0 auto;margin:4px 0 10px">Tutti i mesi</button></div>
<label style="display:flex;gap:8px;align-items:center;margin-bottom:10px;color:inherit;font-size:1rem"><input id="solo" type="checkbox" style="width:auto;margin:0"> Solo lavori da fatturare</label>
<label style="display:flex;gap:8px;align-items:center;margin-bottom:10px;color:inherit;font-size:1rem"><input id="solopag" type="checkbox" style="width:auto;margin:0"> Solo lavori da pagare</label>
<div class="row"><input id="cerca" placeholder="Cerca un cliente"><button id="azcerca" style="flex:0 0 auto;margin:4px 0 10px">Azzera</button></div>
<div id="clienti"></div>
<div id="dett"></div>
<button id="csv" style="width:100%;margin-top:8px">Esporta in Excel (CSV)</button>
<button id="pdfall" style="width:100%;margin-top:8px">Esporta in PDF</button>
<div class="card" style="margin-top:16px">
<h2>Backup completo</h2>
<p class="mut" id="lastbk"></p>
<label style="display:flex;gap:10px;align-items:center;margin-bottom:12px;color:inherit;font-size:1rem"><input id="bk-foto" type="checkbox" checked style="margin:0"> Includi le foto</label>
<button id="bk" class="p" style="width:100%">Scarica backup</button>
<label style="margin-top:18px">Ripristina da un backup</label>
<input id="rs-file" type="file" accept=".json,application/json">
<div id="rs-info" class="mut"></div>
<div class="row" id="rs-btns" hidden style="margin-top:10px"><button id="rs-merge" class="p">Unisci ai dati attuali</button><button id="rs-rep">Sostituisci tutto</button></div>
</div>
</section>

<section id="t-prev" hidden>
<button id="np" class="p" style="width:100%;margin-bottom:14px">+ Nuovo preventivo</button>
<div class="card" id="pform" hidden>
<h2 id="ptit">Nuovo preventivo</h2>
<label>Cliente</label><input id="p-cl" list="p-names" autocomplete="off" placeholder="Es. Signora Maria"><datalist id="p-names"></datalist>
<label>Indirizzo</label><input id="p-ind">
<div class="row"><div><label>Data</label><input id="p-data" type="date"></div><div><label>Valido (giorni)</label><input id="p-val" inputmode="numeric" value="30"></div></div>
<label>Voci del preventivo</label>
<div id="p-voci" style="margin-top:6px"></div>
<button id="p-addv" style="width:100%;margin-bottom:14px">+ Aggiungi voce</button>
<label>IVA %</label><input id="p-iva" inputmode="decimal" value="22">
<div id="p-tot" style="background:var(--tint);border-radius:16px;padding:14px;margin-bottom:14px"></div>
<label>Note (facoltative)</label><textarea id="p-note" rows="2"></textarea>
<button id="p-save" class="p" style="width:100%">Salva preventivo</button>
<button id="p-annulla" style="width:100%;margin-top:8px">Annulla</button>
</div>
<div id="plist"></div>
<div class="card">
<h2>I tuoi dati (compaiono nel PDF)</h2>
<label>Nome o ditta</label><input id="a-n">
<label>Indirizzo</label><input id="a-i">
<label>Partita IVA o codice fiscale</label><input id="a-p">
<label>Telefono o email</label><input id="a-t">
</div>
</section>

<section id="t-fare" hidden>
<div class="card">
<div class="row"><input id="nt" placeholder="Cosa devi ricordare?" style="margin:0"><button id="addt" class="p" style="flex:0 0 auto">Aggiungi</button></div>
</div>
<div class="card" id="todos"></div>
</section>

</main>

<script>
const $=id=>document.getElementById(id);
const K='rapportino_v1';
let S={reports:[],todos:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
S.clients=S.clients||[];S.quotes=S.quotes||[];S.azienda=S.azienda||{};
let dref=null,pt;
function push(){if(!dref)return;clearTimeout(pt);pt=setTimeout(()=>dref.set({json:JSON.stringify(S),ts:S.ts}).then(()=>{$('sync').textContent='Sincronizzato ✓'}).catch(()=>{$('sync').textContent='Sincronizzazione non riuscita'}),800)}
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push();try{fillDl()}catch(e){}};
const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>(Math.round(n*100)/100).toString().replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function parseMat(l){const m=l.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);return m?{q:num(m[1]),n:m[2]}:{q:1,n:l}}

/* tab */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['nuovo','registro','prev','fare'].forEach(t=>$('t-'+t).hidden=t!==b.dataset.t);
  if(b.dataset.t==='registro')drawReg();if(b.dataset.t==='fare')drawTodos();if(b.dataset.t==='prev')drawPrev();
});

/* nuovo */
$('f-data').value=today();
$('salva').onclick=()=>{
  const c=$('f-cliente').value.trim();
  if(!c){alert('Scrivi il nome del cliente.');return}
  const rep={id:editId||uid(),data:$('f-data').value||today(),cliente:c,ind:$('f-ind').value.trim(),lavoro:$('f-lavoro').value.trim(),
    ore:num($('f-ore').value),km:num($('f-km').value),mat:lines($('f-mat').value),costo:num($('f-costo').value),pers:($('f-pers').value&&$('f-pers').value!=='__new')?$('f-pers').value:'',prob:$('f-prob').value.trim()};
  const ix=editId?S.reports.findIndex(z=>z.id===editId):-1;
  if(ix>=0)S.reports[ix]=rep;else S.reports.unshift(rep);
  if(pend.length){FO[rep.id]=(FO[rep.id]||[]).concat(pend).slice(0,4);saveFo();pend=[];$('anteprime').textContent=''}
  if(!S.clients.some(x=>x.nome.toLowerCase()===c.toLowerCase()))S.clients.push({id:uid(),nome:c,ind:$('f-ind').value.trim(),tel:''});
  lines($('f-todo').value).forEach(t=>S.todos.unshift({id:uid(),t,fatto:false}));
  save();
  ['voce','f-cliente','f-ind','f-lavoro','f-ore','f-km','f-mat','f-prob','f-todo'].forEach(i=>$(i).value='');
  $('f-data').value=today();$('sug').hidden=true;
  const was=editId;endEdit();$('nota').textContent=was?'Modifiche salvate ✓':'Rapportino salvato ✓';
  if(was)document.querySelector('#nav button[data-t="registro"]').click();
};

/* dettatura (se il browser la supporta) e salvataggio file */
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    $('mic').hidden=false;
    let rec=null,on=false;const LAB='🎤 Detta il lavoro';
    $('mic').onclick=()=>{
      if(on){if(rec)rec.stop();return}
      rec=new SR();rec.lang='it-IT';rec.interimResults=false;rec.continuous=true;
      const base=$('f-lavoro').value.trim();
      rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';$('f-lavoro').value=(base+' '+t).trim()};
      rec.onend=()=>{on=false;$('mic').classList.remove('rec');$('mic').textContent=LAB};
      rec.onerror=()=>{};
      try{rec.start();on=true;$('mic').classList.add('rec');$('mic').textContent='⏹ Stop'}catch(e){}
    };
  }
  window._d={save:async({filename,data})=>{
    const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':filename.endsWith('.json')?'application/json':'application/octet-stream';
    const blob=data instanceof Blob?data:new Blob([data],{type});
    try{
      const file=new File([blob],filename,{type:blob.type||type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return{status:'delivered'}}
    }catch(e){if(e&&e.name==='AbortError')return{status:'cancelled'}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return{status:'saved'}
  }};
})();

/* registro */
function totali(list){
  const m={};list.forEach(r=>r.mat.forEach(l=>{const p=parseMat(l),k=p.n.toLowerCase();m[k]=m[k]||{n:p.n,q:0};m[k].q+=p.q}));
  return{u:list.length,ore:list.reduce((a,r)=>a+r.ore,0),km:list.reduce((a,r)=>a+r.km,0),costo:list.reduce((a,r)=>a+(r.costo||0),0),mat:Object.values(m)};
}
function drawReg(sel){
  const q=$('cerca').value.toLowerCase(),box=$('clienti');box.textContent='';box.hidden=false;$('dett').textContent='';
  const g={};fr().forEach(r=>{(g[r.cliente]=g[r.cliente]||[]).push(r)});
  if(!$('mese').value&&!$('solo').checked&&!$('solopag').checked)S.clients.forEach(c=>{if(!g[c.nome])g[c.nome]=[]});
  const names=Object.keys(g).filter(n=>n.toLowerCase().includes(q)||((S.clients.find(c=>c.nome===n)||{}).persone||[]).some(p=>p.toLowerCase().includes(q))).sort();
  const card=el('div',null,'card');
  if(!names.length)card.append(el('p','Nessun rapportino ancora.','mut'));
  names.forEach(n=>{const t=totali(g[n]);const it=el('div',null,'item cl');
    const l=el('div');const ps=payState(n);l.append(el('b',n),el('div',t.u+(t.u===1?' uscita · ':' uscite · ')+fmt(t.ore)+' ore'+(ps.u?' · '+ps.u+' da pagare':''),'mut'));
    const lw=el('div');lw.style.cssText='display:flex;align-items:center;gap:14px;min-width:0;flex:1';lw.append(mkDot(ps.cls),l);it.append(lw,el('span','›'));it.onclick=()=>showCl(n,g[n]);card.append(it)});
  box.append(card);
  if(sel&&g[sel])showCl(sel,g[sel]);
}
function closeCl(){$('dett').textContent='';$('clienti').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
function showCl(n,list){
  $('clienti').hidden=true;
  const t=totali(list),d=$('dett');d.textContent='';const c=el('div',null,'card');
  const back=el('button','← Torna ai clienti');back.style.cssText='width:100%;margin-bottom:10px';back.onclick=closeCl;c.append(back);
  c.append(el('h2','Resoconto · '+n));
  const sl=el('div');sl.style.cssText='display:flex;align-items:center;gap:10px;margin:-2px 0 12px';
  const upd=()=>{const ps=payState(n);sl.textContent='';sl.append(mkDot(ps.cls),el('b',ps.u?'Da pagare: '+ps.u+(ps.u===1?' lavoro':' lavori'):(ps.all?'Tutto pagato':'Nessun lavoro')))};
  upd();c.append(sl);
  let cc=S.clients.find(x=>x.nome===n);if(!cc){cc={id:uid(),nome:n,ind:'',tel:'',persone:[]};S.clients.push(cc)}
  if(cc){c.append(el('div',[cc.ind,cc.tel].filter(Boolean).join(' · ')||'Nessun indirizzo o telefono','mut'));
    const dx=el('button','Elimina cliente');dx.style.margin='8px 0';
    dx.onclick=()=>{if(confirm('Eliminare il cliente dall’elenco? I rapportini restano.')){S.clients=S.clients.filter(x=>x!==cc);save();drawReg()}};c.dx=dx;persUI(c,cc)}
  const st=el('div',null,'stat');
  [['uscite',t.u],['ore',fmt(t.ore)],['km',fmt(t.km)]].concat(t.costo?[['€ materiali',fmt(t.costo)]]:[],list.some(r=>!r.fatt)?[['da fatturare',list.filter(r=>!r.fatt).length]]:[],list.some(r=>!r.pag)?[['da pagare',list.filter(r=>!r.pag).length]]:[]).forEach(([k,v])=>{const s=el('div');s.append(el('b',String(v)),el('span',k,'mut'));st.append(s)});
  c.append(st);
  const fb=el('button','Copia riepilogo per fattura');fb.style.cssText='width:100%;margin:10px 0';
  fb.onclick=async()=>{
    if(!list.length){fb.textContent='Nessun lavoro da riepilogare';return}
    const ds=list.map(r=>r.data).sort(),f=x=>x.split('-').reverse().join('/');
    const txt=['Cliente: '+n,'Periodo: dal '+f(ds[0])+' al '+f(ds[ds.length-1]),'Uscite: '+t.u,'Ore totali: '+fmt(t.ore),'Km totali: '+fmt(t.km)].concat(t.costo?['Costo materiali: '+fmt(t.costo)+' euro']:[],['','Materiali:'],t.mat.map(m=>'- '+fmt(m.q)+' × '+m.n),['','Lavori:'],list.slice().sort((a,b)=>a.data<b.data?-1:1).map(r=>'- '+f(r.data)+': '+(r.lavoro||'—')+' ('+fmt(r.ore)+' h)')).join('\n');
    try{await navigator.clipboard.writeText(txt);fb.textContent='Copiato ✓'}catch(e){prompt('Copia il riepilogo:',txt)}
  };
  c.append(fb);
  const lbl=el('div','Includi nell’estratto:','mut');lbl.style.marginTop='8px';c.append(lbl);
  const chk={},og=el('div');og.style.cssText='display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 10px';

/* estratto completo di un cliente: anni, mesi, settimane, totale */
function isoWeek(ds){const d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+3);
  const y=d.getUTCFullYear(),j=new Date(Date.UTC(y,0,4));
  const w=1+Math.round(((d-j)/864e5-3+((j.getUTCDay()+6)%7))/7);return y+'-S'+String(w).padStart(2,'0')}
function clientData(n){
  const L=S.reports.filter(r=>r.cliente===n).sort((a,b)=>a.data<b.data?-1:1);
  const add=(o,r)=>{o.u++;o.ore+=r.ore;o.km+=r.km;o.costo+=(r.costo||0);return o};
  const mk=kf=>{const m={};L.forEach(r=>{const k=kf(r);add(m[k]=m[k]||{u:0,ore:0,km:0,costo:0},r)});return Object.keys(m).sort().map(k=>[k,m[k]])};
  return{L,anni:mk(r=>r.data.slice(0,4)),mesi:mk(r=>r.data.slice(0,7)),sett:mk(r=>isoWeek(r.data)),tot:L.reduce(add,{u:0,ore:0,km:0,costo:0})};
}
async function exportCliente(n,kind,btn,chk){
  const D=clientData(n),old=btn.textContent,say=t=>{btn.textContent=t;setTimeout(()=>{btn.textContent=old},2500)};

  const labA=k=>k,labM=k=>k.slice(5)+'/'+k.slice(0,4),labS=k=>'Sett. '+k.slice(6)+'/'+k.slice(0,4);

    const q=v=>'"'+String(v).replace(/"/g,'""')+'"',row=a=>a.map(q).join(';'),t=o=>[o.u,fmt(o.ore),fmt(o.km),fmt(o.costo)];
    const L=[row(['Cliente',n])];
    if(sel('elenco')){L.push('',row(['ELENCO LAVORI']),row(['Data','Persona','Lavoro','Ore','Km','Materiali','Costo materiali','Fatturato','Pagato']));
      D.L.forEach(r=>L.push(row([f(r.data),r.pers||'',r.lavoro,fmt(r.ore),fmt(r.km),r.mat.join(' | '),fmt(r.costo||0),r.fatt?'Sì':'No',r.pag?'Sì':'No'])))}
    [['anni','TOTALI PER ANNO',D.anni,labA],['mesi','TOTALI PER MESE',D.mesi,labM],['sett','TOTALI PER SETTIMANA',D.sett,labS]].filter(s=>sel(s[0])).forEach(([,tit,arr,lab])=>{
      L.push('',row([tit]),row(['Periodo','Uscite','Ore','Km','Costo materiali']));arr.forEach(([k,o])=>L.push(row([lab(k),...t(o)])))});
    if(sel('tot'))L.push('',row(['TOTALE GENERALE','Uscite','Ore','Km','Costo materiali']),row(['',...t(D.tot)]));

      rw(['Periodo','Uscite','Ore','Km','Materiali EUR'],1);arr.forEach(([k,o])=>rw([lab(k),o.u,fmt(o.ore),fmt(o.km),fmt(o.costo)]))};
    put('Estratto lavori',18,1);y+=2;put('Cliente: '+n,12);
    if(sel('tot'))tab('Totale generale',[['Totale',D.tot]],k=>k);

      D.L.forEach(r=>put(f(r.data)+(r.pers?' - '+r.pers:'')+' - '+fmt(r.ore)+' h - '+(r.lavoro||'-'),10))}
    file=doc.output('blob');name='estratto-'+slug+'.pdf';
  }
  try{if(!window._d)throw 0;await window._d.save({filename:name,data:file});say('Scaricato ✓')}

function applyRs(mode){
  if(!pendRs)return;const j=pendRs;
  if(mode==='rep'){S={reports:j.S.reports,clients:j.S.clients,todos:j.S.todos,quotes:j.S.quotes||[],azienda:j.S.azienda||{}};FO=j.FO||{}}
  else{
    const ids=new Set(S.reports.map(r=>r.id));
    j.S.reports.forEach(r=>{if(!ids.has(r.id)){S.reports.push(r);if(j.FO&&j.FO[r.id])FO[r.id]=j.FO[r.id]}});
    j.S.clients.forEach(c=>{const x=S.clients.find(z=>z.nome.toLowerCase()===c.nome.toLowerCase());
      if(!x)S.clients.push(c);else{x.persone=x.persone||[];(c.persone||[]).forEach(p=>{if(!x.persone.includes(p))x.persone.push(p)})}});
    const ti=new Set(S.todos.map(t=>t.id));j.S.todos.forEach(t=>{if(!ti.has(t.id))S.todos.push(t)});
    S.quotes=S.quotes||[];const qi=new Set(S.quotes.map(t=>t.id));(j.S.quotes||[]).forEach(t=>{if(!qi.has(t.id))S.quotes.push(t)});
    if(!Object.keys(S.azienda||{}).length)S.azienda=j.S.azienda||{};
    S.reports.sort((a,b)=>a.data<b.data?1:-1);
  }
  S.clients=S.clients||[];
  S.quotes=S.quotes||[];S.azienda=S.azienda||{};saveFo();save();pendRs=null;$('rs-btns').hidden=true;
  $('rs-info').textContent=(mode==='rep'?'Dati sostituiti':'Dati uniti')+' ✓';
  drawReg();drawTodos();drawPrev();
}
$('rs-merge').onclick=()=>applyRs('merge');$('rs-rep').onclick=()=>applyRs('rep');

/* PDF di tutto il registro (rispetta mese e "solo da fatturare") */
async function exportAllPdf(btn){
  const old=btn.textContent,say=t=>{btn.textContent=t;setTimeout(()=>{btn.textContent=old},2500)};
  const L=fr().slice().sort((a,b)=>a.data<b.data?-1:1);
  if(!L.length){say('Nessun lavoro');return}
  if(!window.jspdf){say('PDF non disponibile');return}
  const f=x=>x.split('-').reverse().join('/');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=20;
  const nl=h=>{if(y+h>285){doc.addPage();y=20}};
  const put=(t,sz,b)=>{doc.setFontSize(sz);doc.setFont('helvetica',b?'bold':'normal');doc.splitTextToSize(String(t),170).forEach(l=>{nl(sz*0.5);doc.text(l,20,y);y+=sz*0.5})};
  const sum=a=>a.reduce((o,r)=>{o.ore+=r.ore;o.km+=r.km;o.costo+=(r.costo||0);return o},{ore:0,km:0,costo:0});
  const m=$('mese').value,s=$('solo').checked,p=$('solopag').checked,tot=sum(L);
  put('Registro lavori',18,1);y+=2;
  put('Periodo: '+(m?m.slice(5)+'/'+m.slice(0,4):'tutti i mesi')+(s?' - solo da fatturare':'')+(p?' - solo da pagare':''),11);
  put('Lavori: '+L.length+'   Ore: '+fmt(tot.ore)+'   Km: '+fmt(tot.km)+'   Materiali EUR: '+fmt(tot.costo),11,1);
  const g={};L.forEach(r=>{(g[r.cliente]=g[r.cliente]||[]).push(r)});
  Object.keys(g).sort().forEach(n=>{
    const a=g[n],ts=sum(a);
    y+=4;nl(24);put(n,13,1);
    put(a.length+(a.length===1?' lavoro':' lavori')+' - '+fmt(ts.ore)+' h - '+fmt(ts.km)+' km'+(ts.costo?' - materiali EUR '+fmt(ts.costo):''),10);
    a.forEach(r=>{
      nl(16);put(f(r.data)+(r.pers?' - '+r.pers:'')+' - '+fmt(r.ore)+' h'+(r.fatt?' - fatturato':'')+(r.pag?' - pagato':' - da pagare'),10,1);
      put(r.lavoro||'-',10);
      if(r.mat.length)put('Materiali: '+r.mat.join(', ')+(r.costo?' (EUR '+fmt(r.costo)+')':''),10);
      if(r.prob)put('Problemi: '+r.prob,10);
      y+=1.5});
  });
  try{if(!window._d)throw 0;await window._d.save({filename:'registro-lavori'+(m?'-'+m:'')+'.pdf',data:doc.output('blob')});say('Scaricato \u2713')}
  catch(e){say('Download non disponibile')}
}
$('pdfall').onclick=()=>exportAllPdf($('pdfall'));

/* preventivi */
const eur=n=>fmt(n)+' \u20ac';
const ST={attesa:'In attesa',ok:'Accettato',no:'Rifiutato'};
let pEdit=null,pRows=[{d:'',q:'1',p:''}];
function pTot(){const imp=pRows.reduce((a,r)=>a+num(r.q)*num(r.p),0),aliq=num($('p-iva').value),iva=imp*aliq/100;return{imp,aliq,iva,tot:imp+iva}}
function showTot(){const t=pTot(),b=$('p-tot');b.textContent='';
  b.append(el('div','Imponibile: '+eur(t.imp)),el('div','IVA '+fmt(t.aliq)+'%: '+eur(t.iva)));
  const tt=el('div','Totale: '+eur(t.tot));tt.style.cssText='font-weight:800;font-size:1.3rem;margin-top:4px';b.append(tt)}
function drawRows(){
  const box=$('p-voci');box.textContent='';
  pRows.forEach((r,i)=>{
    const w=el('div');w.style.cssText='border:1.5px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px';
    const d=document.createElement('input');d.placeholder='Descrizione (es. Verniciatura salotto)';d.value=r.d;d.style.margin='0 0 8px';d.oninput=()=>{r.d=d.value};
    const row=el('div',null,'row');
    const q=document.createElement('input');q.placeholder='Quantit\u00e0';q.inputMode='decimal';q.value=r.q;q.style.margin='0';q.oninput=()=>{r.q=q.value;showTot()};
    const p=document.createElement('input');p.placeholder='Prezzo \u20ac';p.inputMode='decimal';p.value=r.p;p.style.margin='0';p.oninput=()=>{r.p=p.value;showTot()};
    const x=el('button','\u2715');x.style.cssText='flex:0 0 auto;padding:0 16px';
    x.onclick=()=>{pRows.splice(i,1);if(!pRows.length)pRows.push({d:'',q:'1',p:''});drawRows()};
    row.append(q,p,x);w.append(d,row);box.append(w)});
  showTot();
}
function fillNames(){const dl=$('p-names');dl.textContent='';names().forEach(n=>{const o=document.createElement('option');o.value=n;dl.append(o)})}
function nextNum(y){let m=0;S.quotes.forEach(z=>{const mm=String(z.num).match(/^P-(\d{4})-(\d+)$/);if(mm&&mm[1]===String(y))m=Math.max(m,+mm[2])});return 'P-'+y+'-'+String(m+1).padStart(3,'0')}
function openForm(q){
  pEdit=q?q.id:null;
  $('ptit').textContent=q?'Modifica preventivo '+q.num:'Nuovo preventivo';
  $('p-cl').value=q?q.cliente:'';$('p-ind').value=q?q.ind:'';$('p-data').value=q?q.data:today();
  $('p-val').value=q?q.val:'30';$('p-iva').value=q?fmt(q.iva):'22';$('p-note').value=q?q.nota:'';
  pRows=q?q.voci.map(v=>({d:v.d,q:String(v.q).replace('.',','),p:String(v.p).replace('.',',')})):[{d:'',q:'1',p:''}];
  fillNames();drawRows();$('pform').hidden=false;$('np').hidden=true;$('pform').scrollIntoView({behavior:'smooth'});
}
function closeForm(){pEdit=null;$('pform').hidden=true;$('np').hidden=false}
$('np').onclick=()=>openForm();
$('p-annulla').onclick=closeForm;
$('p-addv').onclick=()=>{pRows.push({d:'',q:'1',p:''});drawRows()};
$('p-iva').oninput=showTot;
$('p-cl').onchange=()=>{const c=S.clients.find(x=>x.nome.toLowerCase()===$('p-cl').value.trim().toLowerCase());if(c&&c.ind&&!$('p-ind').value)$('p-ind').value=c.ind};
$('p-save').onclick=()=>{
  const c=$('p-cl').value.trim();
  const voci=pRows.filter(r=>r.d.trim()||num(r.p)).map(r=>({d:r.d.trim(),q:num(r.q)||1,p:num(r.p)}));
  if(!c){alert('Scrivi il nome del cliente.');return}
  if(!voci.length){alert('Aggiungi almeno una voce con descrizione e prezzo.');return}
  const data=$('p-data').value||today(),ex=pEdit?S.quotes.find(z=>z.id===pEdit):null;
  const q={id:pEdit||uid(),num:ex?ex.num:nextNum(data.slice(0,4)),data,cliente:c,ind:$('p-ind').value.trim(),voci,iva:num($('p-iva').value),val:$('p-val').value.trim()||'30',nota:$('p-note').value.trim(),stato:ex?ex.stato:'attesa'};
  if(ex)S.quotes[S.quotes.indexOf(ex)]=q;else S.quotes.unshift(q);
  if(!S.clients.some(x=>x.nome.toLowerCase()===c.toLowerCase()))S.clients.push({id:uid(),nome:c,ind:q.ind,tel:'',persone:[]});
  save();closeForm();drawPrev();
};
['a-n','a-i','a-p','a-t'].forEach((id,k)=>{$(id).oninput=()=>{S.azienda=S.azienda||{};S.azienda['nipt'[k]]=$(id).value;save()}});
function qTot(q){const imp=q.voci.reduce((a,v)=>a+v.q*v.p,0),iva=imp*q.iva/100;return{imp,iva,tot:imp+iva}}
function drawPrev(){
  const A=S.azienda||{};
  [['a-n','n'],['a-i','i'],['a-p','p'],['a-t','t']].forEach(([id,k])=>{if(document.activeElement!==$(id))$(id).value=A[k]||''});
  const box=$('plist');box.textContent='';
  const card=el('div',null,'card');
  if(!S.quotes.length){card.append(el('p','Nessun preventivo ancora.','mut'));box.append(card);return}
  S.quotes.forEach(q=>{
    const it=el('div',null,'job'),head=el('div',null,'jobh'),l=el('div');l.style.cssText='min-width:0;flex:1';
    const tt=el('div');tt.append(el('b',q.num+' \u00b7 '+q.cliente));
    const bd=el('span',ST[q.stato],'badge'+(q.stato==='ok'?' ok':''));tt.append(bd);
    l.append(tt,el('div',eur(qTot(q).tot)+' \u00b7 '+q.data.split('-').reverse().join('/'),'mut'));
    head.append(l,el('span','\u203a','chev'));
    const dv=el('div',null,'jobd');dv.hidden=true;
    const det=()=>{dv.textContent='';
      q.voci.forEach(v=>{const p=el('div',null,'kv');p.append(el('span',fmt(v.q)+' \u00d7 '+fmt(v.p)),el('span',v.d||'-'));dv.append(p)});
      const t=qTot(q);
      [['Imponibile',eur(t.imp)],['IVA '+fmt(q.iva)+'%',eur(t.iva)],['Totale',eur(t.tot)]].forEach(([k,v])=>{const p=el('div',null,'kv');p.append(el('span',k),el('b',v));dv.append(p)});
      if(q.nota){const p=el('div',null,'kv');p.append(el('span','Note'),el('span',q.nota));dv.append(p)}
      const sr=el('div',null,'row');sr.style.marginTop='10px';
      Object.keys(ST).forEach(k=>{const b=el('button',ST[k]);b.style.padding='12px 4px';
        if(q.stato===k)b.style.cssText='padding:12px 4px;background:var(--tint);border-color:var(--ac);color:var(--ac)';
        b.onclick=()=>{q.stato=k;save();bd.textContent=ST[k];bd.className='badge'+(k==='ok'?' ok':'');det()};sr.append(b)});
      dv.append(sr);
      const bx=el('div',null,'acts'),mb=el('button','Modifica'),pb=el('button','PDF'),x=el('button','Elimina','del');
      mb.onclick=()=>openForm(q);pb.onclick=()=>quotePdf(q);
      x.onclick=()=>{if(confirm('Eliminare questo preventivo?')){S.quotes=S.quotes.filter(z=>z.id!==q.id);save();drawPrev()}};
      bx.append(mb,pb,x);dv.append(bx)};
    head.onclick=()=>{if(dv.hidden)det();dv.hidden=!dv.hidden;it.classList.toggle('open',!dv.hidden)};
    it.append(head,dv);card.append(it)});
  box.append(card);
}
async function quotePdf(q){
  if(!window.jspdf){alert('Generatore PDF non disponibile.');return}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=20;
  const f=x=>x.split('-').reverse().join('/');
  const nl=h=>{if(y+h>280){doc.addPage();y=20}};
  const put=(t,sz,b)=>{doc.setFontSize(sz);doc.setFont('helvetica',b?'bold':'normal');doc.splitTextToSize(String(t),170).forEach(l=>{nl(sz*0.5);doc.text(l,20,y);y+=sz*0.5})};
  const A=S.azienda||{};
  if(A.n)put(A.n,14,1);
  [A.i,A.p?'P.IVA / C.F. '+A.p:'',A.t].filter(Boolean).forEach(t=>put(t,10));
  y+=6;put('Preventivo n. '+q.num,18,1);y+=1;put('Data: '+f(q.data),11);
  y+=3;put('Cliente: '+q.cliente,12,1);if(q.ind)put(q.ind,11);
  y+=6;nl(12);
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Descrizione',20,y);doc.text('Q.t\u00e0',130,y,{align:'right'});doc.text('Prezzo',160,y,{align:'right'});doc.text('Importo',190,y,{align:'right'});
  y+=2;doc.line(20,y,190,y);y+=5;
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  q.voci.forEach(v=>{
    const ls=doc.splitTextToSize(v.d||'-',95);nl(ls.length*5+3);
    doc.text(ls,20,y);doc.text(fmt(v.q),130,y,{align:'right'});doc.text(fmt(v.p),160,y,{align:'right'});doc.text(fmt(v.q*v.p),190,y,{align:'right'});
    y+=ls.length*5+2});
  doc.line(20,y,190,y);y+=6;
  const t=qTot(q);
  const tr=(a,b,bold)=>{nl(8);doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(bold?12:10);doc.text(a,160,y,{align:'right'});doc.text(b,190,y,{align:'right'});y+=bold?7:5.5};
  tr('Imponibile EUR',fmt(t.imp));tr('IVA '+fmt(q.iva)+'% EUR',fmt(t.iva));tr('TOTALE EUR',fmt(t.tot),1);
  y+=4;put('Validit\u00e0: '+q.val+' giorni dalla data del preventivo.',10);
  if(q.nota){y+=2;put('Note: '+q.nota,10)}
  const name='preventivo-'+q.num+'-'+q.cliente.replace(/[^a-z0-9]+/gi,'-')+'.pdf';
  try{if(!window._d)throw 0;await window._d.save({filename:name,data:doc.output('blob')})}
  catch(e){alert('Download del PDF non disponibile qui.')}
}

/* pallini di stato pagamento */
function payState(n){const all=S.reports.filter(r=>r.cliente===n),u=all.filter(r=>!r.pag).length;return{all:all.length,u,cls:!all.length?'n':(u?'r':'g')}}
function mkDot(cls,inl){return el('span',null,'dot '+cls+(inl?' in':''))}

/* da fare */
function drawTodos(){
  const b=$('todos');b.textContent='';
  if(!S.todos.length)b.append(el('p','Niente da fare. 🎉','mut'));
  S.todos.slice().sort((a,b)=>a.fatto-b.fatto).forEach(t=>{
    const it=el('div',null,'item');const l=el('label',null);l.style.cssText='display:flex;gap:10px;align-items:center;color:inherit;font-size:1rem;flex:1';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.fatto;cb.style.cssText='width:auto;margin:0';
    cb.onchange=()=>{t.fatto=cb.checked;save();drawTodos()};
    l.append(cb,el('span',t.t,t.fatto?'done':''));
    const x=el('button','✕');x.onclick=()=>{S.todos=S.todos.filter(z=>z!==t);save();drawTodos()};
    it.append(l,x);b.append(it)});
}
$('addt').onclick=()=>{const v=$('nt').value.trim();if(!v)return;S.todos.unshift({id:uid(),t:v,fatto:false});$('nt').value='';save();drawTodos()};
